name: Release

# Fires when you push a version tag (e.g. `git tag v1.0.0 && git push --tags`).
# Builds the exe, packages MSIX/APPX/bundles, signs them if signing
# secrets are configured, and attaches everything to a GitHub Release.
#
# Required repo secrets for signing (Settings -> Secrets and variables ->
# Actions). If these are not set, the workflow still runs and still
# creates the Release, but the packages are left UNSIGNED — fine for
# your own testing/sideloading, but Partner Center submission expects a
# package it can validate against your identity, so set these before a
# real Store submission:
#
#   CSC_LINK         base64-encoded .pfx certificate
#   CSC_KEY_PASSWORD  password for that .pfx
#
# See README.md "Code signing" section for how to generate/encode a cert.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp into the package (e.g. 1.0.0). Only used for manual runs - tag pushes use the tag itself."
        required: false
        default: "0.0.0"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: pip install -r requirements.txt

      - name: Build executable (PyInstaller)
        run: pyinstaller packaging/BasicSOCDrills.spec --distpath dist --workpath build --noconfirm

      - name: Decode signing certificate (if configured)
        id: cert
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
        run: |
          if ([string]::IsNullOrEmpty($env:CSC_LINK)) {
            Write-Host "No CSC_LINK secret set - building unsigned."
            echo "has_cert=false" >> $env:GITHUB_OUTPUT
          } else {
            $bytes = [Convert]::FromBase64String($env:CSC_LINK)
            [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\release_cert.pfx", $bytes)
            echo "has_cert=true" >> $env:GITHUB_OUTPUT
            echo "cert_path=$env:RUNNER_TEMP\release_cert.pfx" >> $env:GITHUB_OUTPUT
          }

      - name: Package + sign MSIX / APPX
        shell: pwsh
        env:
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ github.event.inputs.version }}" + ".0"
          } else {
            $version = "${{ github.ref_name }}".TrimStart("v") + ".0"
          }
          if ("${{ steps.cert.outputs.has_cert }}" -eq "true") {
            ./packaging/build_msix.ps1 -PfxPath "${{ steps.cert.outputs.cert_path }}" -PfxPassword "$env:CSC_KEY_PASSWORD" -Version $version
          } else {
            ./packaging/build_msix.ps1 -Version $version
          }

      - name: Clean up decoded certificate
        if: always()
        shell: pwsh
        run: |
          $p = "${{ steps.cert.outputs.cert_path }}"
          if ($p -and (Test-Path $p)) { Remove-Item $p -Force }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', github.event.inputs.version) || github.ref_name }}
          files: |
            out/BasicSOCDrills.msix
            out/BasicSOCDrills.appx
            out/BasicSOCDrills.msixbundle
            out/BasicSOCDrills.appxbundle
            dist/BasicSOCDrills.exe
          generate_release_notes: true
